<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>GS College Smart Attendance</title><link rel="stylesheet" href="style.css"></head><body>
<div id="loading" class="loading hidden">Processing...</div>
<section id="homePage" class="page active"><div class="hero"><h1>GS College</h1><h2>Smart Attendance System</h2><p>📍 Location Based Attendance</p><button onclick="showRolePage()">Get Started</button></div></section>
<section id="rolePage" class="page"><div class="box"><button onclick="showPage('homePage')">← Back</button><h1>Select Login</h1><button onclick="openLogin('student')">👨‍🎓 Student</button><button onclick="openLogin('teacher')">👨‍🏫 Teacher</button><button onclick="openLogin('admin')">👨‍💼 Admin</button></div></section>
<section id="loginPage" class="page"><div class="box"><button onclick="showRolePage()">← Back</button><h1 id="loginTitle">Login</h1><form id="loginForm"><input id="email" type="email" placeholder="Email"><input id="username" class="hidden" placeholder="Admin Username"><input id="password" type="password" placeholder="Password" required><button type="submit">Login</button></form><p id="registerText">New Student? <span onclick="showRegisterPage()">Register Here</span></p></div></section>
<section id="registerPage" class="page"><div class="box"><button onclick="openLogin('student')">← Back</button><h1>Student Registration</h1><form id="registerForm"><input id="regName" placeholder="Full Name" required><input id="regEmail" type="email" placeholder="Email" required><input id="regCourse" placeholder="Course" required><select id="regYear" required><option value="">Select Year</option><option>1</option><option>2</option><option>3</option></select><input id="regPassword" type="password" placeholder="Password" required><button>Register</button></form></div></section>
<section id="studentDashboard" class="page"><div class="box"><button onclick="logout()">Logout</button><h1 id="studentName">Welcome</h1><p id="studentLocationStatus">Location not checked</p><button onclick="checkLocation('student')">Check My Location</button><button id="studentAttendanceBtn" onclick="markAttendance()" disabled>Mark Attendance</button><div id="studentAttendanceList"></div></div></section>
<section id="teacherDashboard" class="page"><div class="box"><button onclick="logout()">Logout</button><h1 id="teacherName">Welcome</h1><p id="teacherLocationStatus">Location not checked</p><button onclick="checkLocation('teacher')">Check My Location</button><button id="teacherAttendanceBtn" onclick="markAttendance()" disabled>Mark Attendance</button><div id="teacherAttendanceList"></div></div></section>
<section id="adminDashboard" class="page"><div class="box"><button onclick="logout()">Logout</button><h1>Admin Dashboard</h1><p>Students: <span id="studentCount">0</span></p><p>Teachers: <span id="teacherCount">0</span></p><button onclick="loadAdminData()">Refresh</button><div id="adminAttendanceList"></div></div></section>
<script src="script.js"></script></body></html>
